[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-benchmark"
version = "0.1.0"
description = "Benchmark LLM prefill, decode, latency, and SLO capacity for vLLM and OpenAI-compatible APIs."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["benchmark", "llm", "inference", "vllm", "openai-compatible"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Benchmark",
]
dependencies = []

[project.optional-dependencies]
api = [
  "requests==2.32.5",
  "transformers==4.57.6",
]
random = ["numpy==2.3.5"]
test = [
  "numpy==2.3.5",
  "pytest==8.4.2",
]

[project.scripts]
llm-benchmark = "benchmark.benchmark:main"

[tool.setuptools.packages.find]
include = ["benchmark*"]
