[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-benchmark"
version = "0.1.0"
description = "Benchmark LLM prefill, decode, latency, and SLO capacity for vLLM and OpenAI-compatible APIs."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["benchmark", "llm", "inference", "vllm", "openai-compatible"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Benchmark",
]
dependencies = [
  "boto3==1.43.81",
  "rich==14.2.0",
]

[project.optional-dependencies]
api = [
  "requests==2.34.2",
  "aiohttp==3.14.3",
  "transformers==5.16.1",
]
# Retained as a compatibility alias; boto3 is now installed by default.
s3 = []
random = ["numpy==2.5.2"]
test = [
  "numpy==2.5.2",
  "pytest==9.1.1",
]

[project.scripts]
llm-benchmark = "benchmark.benchmark:main"

[tool.setuptools.packages.find]
include = ["benchmark*"]

[tool.ruff.lint.per-file-ignores]
"benchmark/benchmark.py" = ["BLE001", "S110", "TRY004"]
"benchmark/api_transport.py" = ["BLE001"]
"benchmark/host_inventory.py" = ["BLE001"]
"benchmark/suite_automation.py" = ["BLE001", "TRY004"]
"benchmark/benchmark_datasets.py" = ["TRY004"]
"benchmark/request_schedule.py" = ["TRY004"]
"benchmark/report_storage.py" = ["SIM115"]
"tests/test_api_transport.py" = ["PYI034", "RUF007"]
"tests/test_progress.py" = ["PYI034", "RUF012"]
"tests/test_streaming.py" = ["PYI034"]
"tests/test_benchmark_helpers.py" = ["FLY002", "RUF007"]
"tests/test_compose_service.py" = ["RUF034"]
"tests/test_suite_automation.py" = ["PERF102"]
"web/report_server.py" = ["TRY004"]
