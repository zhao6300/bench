services:
  inference:
    image: ${ENGINE_IMAGE}
    entrypoint:
      - python3
      - -m
      - sglang.launch_server
    command:
      - --model-path
      - ${MODEL_ID}
      - --tokenizer-path
      - ${TOKENIZER_ID}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tp-size
      - ${TP_SIZE}
      - --dp
      - ${DP_SIZE}
      - --context-length
      - ${MAX_MODEL_LEN:-262144}
      - --mem-fraction-static
      - ${MEM_FRACTION_STATIC:-0.90}
      - --reasoning-parser
      - qwen3
      - --served-model-name
      - ${SERVED_MODEL_NAME}
    environment:
      NVIDIA_VISIBLE_DEVICES: ${GPU_DEVICES}
    ports:
      - "${HOST_PORT}:8000"

  benchmark:
    image: ${BENCHMARK_IMAGE}
    entrypoint:
      - llm-benchmark
