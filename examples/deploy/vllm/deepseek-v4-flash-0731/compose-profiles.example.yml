services:
  inference:
    image: ${ENGINE_IMAGE}
    entrypoint:
      - vllm
    command:
      - serve
      - ${MODEL_ID}
      - --tokenizer
      - ${TOKENIZER_ID}
      - --tokenizer-mode
      - deepseek_v4
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --data-parallel-size
      - ${DP_SIZE}
      - --enable-expert-parallel
      - --max-model-len
      - ${MAX_MODEL_LEN:-262144}
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION:-0.90}
      - --enable-prefix-caching
      - --reasoning-parser
      - deepseek_r1
      - --served-model-name
      - ${SERVED_MODEL_NAME}
    environment:
      NVIDIA_VISIBLE_DEVICES: ${GPU_DEVICES}
    ports:
      - "${HOST_PORT}:8000"

  benchmark:
    image: ${BENCHMARK_IMAGE}
    entrypoint:
      - llm-benchmark
