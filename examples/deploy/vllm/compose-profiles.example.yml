services:
  inference:
    image: ${ENGINE_IMAGE}
    entrypoint:
      - vllm
    command:
      - serve
      - ${MODEL_ID}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --data-parallel-size
      - ${DP_SIZE}
    environment:
      NVIDIA_VISIBLE_DEVICES: ${GPU_DEVICES}
    ports:
      - "${HOST_PORT}:8000"

  benchmark:
    image: ${BENCHMARK_IMAGE}
    entrypoint:
      - llm-benchmark
