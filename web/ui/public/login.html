<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>推理基准报告登录</title>
    <style>
      :root {
        color-scheme: light;
        --line: #e4e7ef;
        --fg: #1f2430;
        --subtle: #7a8494;
        --fg-muted: #5e6877;
        --fg-subtle: #454f62;
        --blue: #5c8ff7;
        --teal: #3ec9b9;
        --bg: #f6f7fb;
        --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: grid;
        align-items: center;
        justify-items: center;
        padding: 24px 16px;
        background: radial-gradient(110vw 55vh at 20% 0%, #ffffff, #edf0f8cc), var(--bg);
        color: var(--fg);
        font: 16px/1.5 var(--font);
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(400px, 100%);
        padding: 28px;
        border: 1px solid rgba(224, 229, 241, .8);
        border-radius: 20px;
        background: rgba(255,255,255,.94);
        box-shadow: 0 16px 38px rgba(22,28,54,.11);
      }
main {
  width: min(920px, 100%);
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 30px;
  padding: 38px;
  border: 1px solid rgba(224, 229, 241, .8);
  border-radius: 24px;
  background: linear-gradient(140deg, rgba(255,255,255,.97), rgba(238, 242, 252,.97));
  box-shadow: 0 16px 38px rgba(22,28,54,.11);
}
.brand-side { align-self: stretch; display: grid; align-content: space-between; }
.icon {
  width: 58px; height: 58px;
  display: grid; place-items: center;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--blue), var(--teal));
  color: white; font-weight: 700;
}
h1 { font-size: 1.72rem; margin: 12px 0 4px; }
p.lede { color: #616c7c; margin: 0 0 22px; font-size: .9rem; max-width: 430px; }
.points { display: grid; gap: 12px; color: #616c7c; font-size: .84rem; }
.points span {
  display: inline-flex; align-items: center;
  gap: 10px;
}
.points b { color: var(--fg); font-size: .88rem; }
.points em {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border-radius: 10px;
  background: #edf2fe; color: #35569d;
  font-size: .84rem; font-style: normal; font-weight: 700;
}
.form-panel { display: grid; align-content: center; gap: 12px; }
label { font-size: .74rem; color: #5c6775; font-weight: 650; }
input { margin-top: 6px; }
input, button {
  width: 100%; border-radius: 12px;
}
input {
  margin-bottom: 4px; height: 46px; padding: 0 14px;
  border: 1px solid var(--line); background: #fff; color: var(--fg); font-size: .92rem;
}
button {
  margin: 10px 0 0; height: 46px; border: 0; cursor: pointer;
  background: linear-gradient(135deg, var(--blue), var(--teal));
  color: white; font-size: .9rem; font-weight: 640;
}
button:disabled { opacity: .65; cursor: wait; }
p.error { color: #a03044; margin-top: 10px; font-size: .84rem; }
p.hint { color: #6f7989; margin-top: 14px; font-size: .76rem; }
@media (max-width: 760px) {
  main {
    width: min(430px, 100%);
    grid-template-columns: 1fr;
    padding: 26px;
  }
  h1 { text-align: center; font-size: 1.28rem; }
  p.lede { text-align: center; max-width: none; }
  .points { display: none; }
  .icon { margin: 0 auto 16px; }
}
    </style>
  </head>
<body>
  <main>
    <section class="brand-side">
      <section>
        <div class="icon" aria-hidden="true">LB</div>
        <h1>LLM Benchmark</h1>
        <p class="lede">登录后查看基准报告的整体概览、用例结果、服务等级目标与性能对比。</p>
        <div class="points">
          <span><em>概览</em><b>核心指标、吞吐与延迟趋势一起呈现</b></span>
          <span><em>对比</em><b>选择两份报告并自动对齐用例</b></span>
          <span><em>安全</em><b>HttpOnly 会话 Cookie 且报告数据受登录保护</b></span>
        </div>
      </section>
    </section>
    <section class="form-panel">
      <form id="login-form">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit" id="submit">登录</button>
      </form>
      <p class="error" id="error" role="alert" hidden></p>
      <p class="hint">登录成功后将使用 HttpOnly 会话 Cookie 访问报告。</p>
    </section>
  </main>
    <script>
      const form = document.getElementById("login-form");
      const button = document.getElementById("submit");
      const error = document.getElementById("error");
      async function submit(event) {
        event.preventDefault();
        const data = new FormData(form);
        button.disabled = true;
        error.hidden = true;
        try {
          const response = await fetch("/api/auth/session", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: data.get("username"), password: data.get("password") }),
            cache: "no-store",
          });
          if (!response.ok) {
            const body = await response.json().catch(() => ({ message: "" }));
            error.textContent = body.message || "账号或密码错误";
            error.hidden = false;
            if (response.status !== 401) throw new Error("登录失败");
          } else {
            window.location.replace("/reports/");
          }
        } catch {
          error.textContent = error.textContent || "登录失败";
          error.hidden = false;
        } finally {
          button.disabled = false;
        }
      }
      form.addEventListener("submit", submit);
    </script>
  </body>
</html>
